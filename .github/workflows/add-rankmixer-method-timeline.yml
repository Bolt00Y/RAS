name: Add RankMixer Method Timeline

on:
  push:
    branches:
      - RankMixer

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out RankMixer
        uses: actions/checkout@v4
        with:
          ref: RankMixer
          fetch-depth: 0

      - name: Insert chronological method table
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          def decode(value: str) -> str:
              return base64.b64decode(value).decode('utf-8')

          marker = decode('5Zug5q2k77yM6L+Z5Lqb5pa55rOV5Lit5pyJ5LiA6YOo5YiG5piv5LqS6KGl55qE77yM6ICM5LiN5piv5LqS5pal55qE44CCCgotLS0KCiMjIDIuIOe7n+S4gOWdkOagh+ezu++8mlJhbmtNaXhlciDljp/lp4vmnrbmnoTliLDlupXlm7rlrprkuobku4DkuYg=')
          block = decode('')
          old_rows = decode('')
          new_rows = decode('')

          doc = Path('RankMixer/docs/13_rankmixer_post_variants_architecture_summary.md')
          text = doc.read_text(encoding='utf-8')
          if text.count(marker) != 1:
              raise SystemExit(f'expected one document marker, found {text.count(marker)}')
          doc.write_text(text.replace(marker, block), encoding='utf-8')

          readme = Path('RankMixer/README.md')
          readme_text = readme.read_text(encoding='utf-8')
          if readme_text.count(old_rows) != 1:
              raise SystemExit(f'expected one README method table, found {readme_text.count(old_rows)}')
          readme.write_text(readme_text.replace(old_rows, new_rows), encoding='utf-8')
          PY
          git diff --check

      - name: Commit timeline
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No update needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RankMixer/docs/13_rankmixer_post_variants_architecture_summary.md RankMixer/README.md
          git commit -m 'Add chronological RankMixer method timeline [skip ci]'
          git push origin HEAD:RankMixer
