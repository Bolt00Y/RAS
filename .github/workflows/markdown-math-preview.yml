name: Markdown Math Preview

on:
  push:
    branches:
      - RankMixer
    paths:
      - "**/*.md"
      - ".github/scripts/**"
      - ".github/workflows/markdown-math-preview.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".github/scripts/**"
      - ".github/workflows/markdown-math-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject Markdown that still needs normalization
        run: python .github/scripts/normalize_markdown_math.py .

      - name: Reject simple equations formatted as code
        run: python .github/scripts/audit_markdown_math_classification.py

      - name: Verify GitHub GFM recognizes every formula as math
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/validate_github_markdown_render.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Parse every Markdown math block with MathJax
        shell: bash
        run: |
          validator_dir="$(mktemp -d)"
          npm install \
            --prefix "$validator_dir" \
            --no-save \
            --ignore-scripts \
            mathjax-full@3.2.2
          cp .github/scripts/validate_markdown_math.mjs \
            "$validator_dir/validate_markdown_math.mjs"
          node "$validator_dir/validate_markdown_math.mjs" "$GITHUB_WORKSPACE"

      - name: Check whitespace integrity
        run: git diff --check
