name: Markdown Math Preview

on:
  push:
    branches:
      - RankMixer
    paths:
      - "**/*.md"
      - ".github/scripts/**"
      - ".github/workflows/markdown-math-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out RankMixer
        uses: actions/checkout@v4
        with:
          ref: RankMixer
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize RankUp inline math boundaries
        run: python .github/scripts/fix_rankup_inline_math_spacing.py

      - name: Reject Markdown that still needs normalization
        run: python .github/scripts/normalize_markdown_math.py .

      - name: Reject equations formatted as code
        run: python .github/scripts/audit_markdown_math_classification.py

      - name: Verify GitHub GFM recognizes every formula as math
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/validate_github_markdown_render.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Parse every Markdown math block with MathJax
        shell: bash
        run: |
          validator_dir="$(mktemp -d)"
          npm install \
            --prefix "$validator_dir" \
            --no-save \
            --ignore-scripts \
            mathjax-full@3.2.2
          cp .github/scripts/validate_markdown_math.mjs \
            "$validator_dir/validate_markdown_math.mjs"
          node "$validator_dir/validate_markdown_math.mjs" "$GITHUB_WORKSPACE"

      - name: Check intended diff
        run: |
          git diff --check
          git diff -- RankMixer/docs/04_rankup_paper_walkthrough.md

      - name: Commit corrected RankUp document
        shell: bash
        run: |
          if git diff --quiet -- RankMixer/docs/04_rankup_paper_walkthrough.md; then
            echo "No RankUp Markdown correction was needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- RankMixer/docs/04_rankup_paper_walkthrough.md
          git commit -m "Normalize RankUp formula boundaries for GitHub Preview [skip ci]"
          git push origin HEAD:RankMixer
