name: Markdown Math Preview

on:
  push:
    branches:
      - RankMixer
    paths:
      - "**/*.md"
      - ".github/scripts/**"
      - ".github/workflows/markdown-math-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out RankMixer branch
        uses: actions/checkout@v4
        with:
          ref: RankMixer
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert equation-like code to GitHub math
        run: |
          python .github/scripts/fix_rankmixer_math_rendering.py
          python .github/scripts/fix_rankmixer_math_rendering_post.py

      - name: Reject Markdown that still needs normalization
        run: python .github/scripts/normalize_markdown_math.py .

      - name: Validate GitHub GFM math classification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/validate_github_markdown_render.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Parse every Markdown math block with MathJax
        shell: bash
        run: |
          validator_dir="$(mktemp -d)"
          npm install \
            --prefix "$validator_dir" \
            --no-save \
            --ignore-scripts \
            mathjax-full@3.2.2
          cp .github/scripts/validate_markdown_math.mjs \
            "$validator_dir/validate_markdown_math.mjs"
          node "$validator_dir/validate_markdown_math.mjs" "$GITHUB_WORKSPACE"

      - name: Check and show intended diff
        run: |
          git diff --check
          git diff -- RankMixer/README.md RankMixer/docs

      - name: Commit corrected Markdown
        shell: bash
        run: |
          if git diff --quiet -- RankMixer/README.md RankMixer/docs; then
            echo "No Markdown corrections were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            RankMixer/README.md \
            RankMixer/docs/01_literature_and_diagnosis.md \
            RankMixer/docs/02_modification_schemes.md \
            RankMixer/docs/03_experiment_protocol.md
          git commit -m "Fix formula classification for GitHub Preview [skip ci]"
          git push origin HEAD:RankMixer
