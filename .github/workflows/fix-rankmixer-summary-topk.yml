name: Fix RankMixer Summary Top-k

on:
  push:
    branches:
      - RankMixer

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out RankMixer
        uses: actions/checkout@v4
        with:
          ref: RankMixer
          fetch-depth: 0

      - name: Replace ambiguous inline math
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('RankMixer/docs/13_rankmixer_post_variants_architecture_summary.md')
          text = path.read_text(encoding='utf-8')
          old = '使用固定 top-$k$ 稀疏路由'
          new = '使用固定 top-k 稀疏路由'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one target, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check

      - name: Commit correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No correction needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RankMixer/docs/13_rankmixer_post_variants_architecture_summary.md
          git commit -m 'Fix top-k Markdown rendering [skip ci]'
          git push origin HEAD:RankMixer
